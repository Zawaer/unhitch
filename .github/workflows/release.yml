name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: make zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Unhitch.zip
          generate_release_notes: true
